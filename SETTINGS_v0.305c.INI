windowX=5
windowY=483
windowWidth=805
windowHeight=549

WindowsState=0

Background=2,3,2
WindowButtonsColor=2,30,2

instrumentsMidiMode=canal
; mode canal / track



[Notes]

C=220,220,170
C_SHARP=200,200,170
D=190,190,190
D_SHARP=180,180,180
E=220,170,170
F=220,220,240
F_SHARP=230,230,250
G=140,140,210
G_SHARP=170,170,200
A=160,210,160
A_SHARP=170,200,170
B=180,160,160
PercussionColor=255,255,255


; Note rectangle dimensions en pixels (width,height) - Defaults: 4,6
; Notes # shift ( débaut = 0 ) pour visualiser façon clavier
; Minimum brightness percentage in linear light (0-100).
; 1.00 is a linear velocity-to-light response.
NotePixelWH=4,6
SharpPixelShift=1
VelocityMinimumPercent=20
VelocityCurve=2

MidiLinearControlsColor=70,70,70



[Display]


; LIGNES-GUIDE
; Visible MIDI note range (0 to 127).  21= le LA grave d'un piano  108 = Do aigue
; Horizontal guide-line thickness in pixels (1 to 8).
; Horizontal guide-line color
; Special marker under C3 (MIDI note 60) color
; Markers under all other C notes color
FirstNote=21
LastNote=108
LineThickness=5
Lines=90,90,90
LinesMiddleC3color=120,120,120
LinesCOctavesCcolor=80,80,80

; centered Pan line (CC10 , track mode )
verticalPanCenterLine=80,80,80

; Titre du morceau (de 8 a 40)
; Taille des des 3 lignes de textes ( lyrics, marker, copyright )
; Taille des noms de sons-GM / noms de pistes
; Taille des textes de la fenêtre "infos"
TrackTitleFontSize=28
TextesFontSize=16
InstrumentFontSize=12
MusicdataFontSize=14


[Progress]

; BARRE DE PROGRESSION
; couleur du liseré au dessus de la progress-bar
; couleur de la progress-bar elle meme
; couleur fond de la barre
; épaisseur en hauteur de cette Progress bar (2 to 28)
ProgressTopEdge=200,200,200
ProgressBar=80,80,80
ProgressBackground=20,20,20
ProgressHeight=28


[Footer]

TransportZoneBackground=63,63,63
AppNameFontSize=16
AppNameColor=10,10,10
AuthorFontSize=16
AuthorColor=10,10,10
VersionFontSize=16
VersionColor=10,10,10


[Keyboard]

PlayPause=SPACE
Left=LEFT
Right=RIGHT
VolumeUp=UP
VolumeDown=DOWN
; Relative seek distance in seconds.
SeekSeconds=5

; Virtual-key names  LEFT, RIGHT, UP, DOWN, SPACE, HOME, END, PAGEUP, PAGEDOWN,
